services:
  chat:
    container_name: chat
    image: ghcr.io/kelseywilliams/chat:workflow
    ports:
      - "3029:3029"
    secrets:
      - redis_secret
    networks:
      - site
    restart: unless-stopped

secrets:
  redis_secret:
    file: ./secrets/redis_secret.txt

networks:
  site:
    external: true
